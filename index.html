<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Studio - Week 2 Project</title>
  <!-- Tailwind CSS CDN for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- pdf-lib CDN for modifying and saving PDFs -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- pdf.js CDN for rendering visual page thumbnails -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">PDF Studio (Project 1)</h1>
    <span class="text-xs bg-blue-800 px-3 py-1 rounded-full">100% Offline & Private[cite: 3]</span>
  </header>

  <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
    
    <!-- Sidebar / Controls -->
    <aside class="w-full md:w-80 bg-white p-4 shadow-lg overflow-y-auto flex flex-col gap-6">
      
      <!-- Group 1: Organise (Merge, Reorder, Delete) -->
      <section class="border-b pb-4">
        <h2 class="font-bold text-gray-700 mb-2">1. Organise</h2>
        <label class="block mb-3">
          <span class="sr-only">Choose PDF files</span>
          <input type="file" id="pdfInput" accept="application/pdf" multiple class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
        </label>
        <button id="exportPdfBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md transition shadow">
          Export & Save PDF[cite: 3]
        </button>
      </section>

      <!-- Group 2: Edit (Text, Shapes) -->
      <section class="border-b pb-4">
        <h2 class="font-bold text-gray-700 mb-2">2. Edit</h2>
        <div class="flex flex-col gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-500">Add Text to All Pages</label>
            <div class="flex gap-2 mt-1">
              <input type="text" id="textInput" placeholder="Enter text..." class="border text-sm p-2 rounded w-full"/>
              <button id="addTextBtn" class="bg-gray-800 hover:bg-black text-white px-3 py-2 rounded text-sm">Add</button>
            </div>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-500">Add Shape</label>
            <button id="addRectangleBtn" class="w-full mt-1 bg-gray-100 hover:bg-gray-200 text-gray-700 border py-2 rounded text-sm">
              + Insert Red Box
            </button>
          </div>
        </div>
      </section>

      <!-- Group 3: Compress / Finish -->
      <section>
        <h2 class="font-bold text-gray-700 mb-2">3. Compress & Finish</h2>
        <button id="compressPdfBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-md transition shadow">
          Compress PDF[cite: 3]
        </button>
        <div id="compressionStats" class="mt-3 text-xs text-gray-600 hidden bg-gray-50 p-2 rounded border">
          <p>Original Size: <span id="origSize" class="font-semibold">0 KB</span></p>
          <p>Compressed Size: <span id="compSize" class="font-semibold text-emerald-600">0 KB</span></p>
        </div>
      </section>

    </aside>

    <!-- Page Workspace / Preview Grid -->
    <main class="flex-1 bg-gray-200 p-6 overflow-y-auto">
      <div class="mb-4 text-sm text-gray-600">
        <p><strong>Instructions:</strong> Upload one or more PDFs. Use the arrows to reorder pages, delete unwanted pages, add edits, and save locally[cite: 3]!</p>
      </div>
      <div id="pageGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
        <!-- Dynamic page cards appear here -->
      </div>
    </main>

  </div>

  <script>
    // Initialize PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let loadedPages = []; // Stores page objects: { id, pdfBytes, pageIndex, thumbnailUrl, overlays }

    const pdfInput = document.getElementById('pdfInput');
    const pageGrid = document.getElementById('pageGrid');
    const exportPdfBtn = document.getElementById('exportPdfBtn');
    const addTextBtn = document.getElementById('addTextBtn');
    const addRectangleBtn = document.getElementById('addRectangleBtn');
    const compressPdfBtn = document.getElementById('compressPdfBtn');

    // 1. Load uploaded PDF files and render thumbnails
    pdfInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      for (const file of files) {
        const arrayBuffer = await file.arrayBuffer();
        const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        
        for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
          const page = await pdfDoc.getPage(pageNum);
          const viewport = page.getViewport({ scale: 0.3 });
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({ canvasContext: context, viewport: viewport }).promise;

          loadedPages.push({
            id: 'page_' + Math.random().toString(36).substr(2, 9),
            pdfBytes: arrayBuffer,
            pageIndex: pageNum - 1,
            thumbnailUrl: canvas.toDataURL(),
            overlays: []
          });
        }
      }
      renderGrid();
    });

    // Render workspace thumbnail grid
    function renderGrid() {
      pageGrid.innerHTML = '';
      if (loadedPages.length === 0) {
        pageGrid.innerHTML = `<p class="text-gray-500 italic col-span-full">No PDFs loaded yet. Upload files using the sidebar.</p>`;
        return;
      }

      loadedPages.forEach((pageObj, index) => {
        const card = document.createElement('div');
        card.className = 'bg-white p-3 rounded-lg shadow border flex flex-col items-center relative';
        
        card.innerHTML = `
          <div class="text-xs text-gray-500 mb-2 font-bold">Page ${index + 1}</div>
          <img src="${pageObj.thumbnailUrl}" class="border mb-3 rounded max-h-48 object-contain bg-gray-50"/>
          <div class="flex gap-1 w-full">
            <button onclick="movePage(${index}, -1)" class="flex-1 bg-gray-100 hover:bg-gray-200 border rounded py-1 text-xs font-bold" title="Move Left">←</button>
            <button onclick="deletePage(${index})" class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 rounded py-1 text-xs font-semibold">Delete</button>
            <button onclick="movePage(${index}, 1)" class="flex-1 bg-gray-100 hover:bg-gray-200 border rounded py-1 text-xs font-bold" title="Move Right">→</button>
          </div>
        `;
        pageGrid.appendChild(card);
      });
    }

    // Move page position (Reorder)
    window.movePage = function(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= loadedPages.length) return;
      const [movedPage] = loadedPages.splice(index, 1);
      loadedPages.splice(newIndex, 0, movedPage);
      renderGrid();
    };

    // Delete page
    window.deletePage = function(index) {
      loadedPages.splice(index, 1);
      renderGrid();
    };

    // 2. Add Edit Overlays (Text / Shapes)
    addTextBtn.addEventListener('click', () => {
      const text = document.getElementById('textInput').value;
      if (!text) return alert('Please enter some text first.');
      loadedPages.forEach(p => p.overlays.push({ type: 'text', content: text }));
      alert(`Added text overlay "${text}" to all current pages.`);
      document.getElementById('textInput').value = '';
    });

    addRectangleBtn.addEventListener('click', () => {
      loadedPages.forEach(p => p.overlays.push({ type: 'shape', shape: 'rect' }));
      alert('Added red box overlay to all current pages.');
    });

    // Build final combined PDF using pdf-lib
    async function generatePdfDoc() {
      const mergedPdf = await PDFLib.PDFDocument.create();

      for (const item of loadedPages) {
        const srcDoc = await PDFLib.PDFDocument.load(item.pdfBytes);
        const [copiedPage] = await mergedPdf.copyPages(srcDoc, [item.pageIndex]);
        
        // Apply saved overlays (Text & Shapes) onto the page coordinates
        item.overlays.forEach(overlay => {
          if (overlay.type === 'text') {
            copiedPage.drawText(overlay.content, {
              x: 50,
              y: copiedPage.getHeight() - 50,
              size: 20,
              color: PDFLib.rgb(0, 0, 0)
            });
          } else if (overlay.type === 'shape' && overlay.shape === 'rect') {
            copiedPage.drawRectangle({
              x: 50,
              y: copiedPage.getHeight() - 120,
              width: 120,
              height: 40,
              color: PDFLib.rgb(0.9, 0.2, 0.2)
            });
          }
        });

        mergedPdf.addPage(copiedPage);
      }
      return mergedPdf;
    }

    // Export and Save PDF locally[cite: 3]
    exportPdfBtn.addEventListener('click', async () => {
      if (loadedPages.length === 0) return alert('Please upload at least one PDF.');
      const pdfDoc = await generatePdfDoc();
      const pdfBytes = await pdfDoc.save();
      downloadBuffer(pdfBytes, 'pdf_studio_output.pdf');
    });

    // 3. Compress PDF feature[cite: 3]
    compressPdfBtn.addEventListener('click', async () => {
      if (loadedPages.length === 0) return alert('Please upload at least one PDF.');
      
      const pdfDoc = await generatePdfDoc();
      const uncompressedBytes = await pdfDoc.save({ useObjectStreams: false });
      
      // Save with object streams enabled to shrink structural overhead
      const compressedBytes = await pdfDoc.save({ useObjectStreams: true });
      
      const origKb = (uncompressedBytes.length / 1024).toFixed(1);
      const compKb = (compressedBytes.length / 1024).toFixed(1);

      document.getElementById('origSize').textContent = `${origKb} KB`;
      document.getElementById('compSize').textContent = `${compKb} KB`;
      document.getElementById('compressionStats').classList.remove('hidden');

      downloadBuffer(compressedBytes, 'pdf_studio_compressed.pdf');
    });

    // Helper to trigger browser file download locally
    function downloadBuffer(buffer, filename) {
      const blob = new Blob([buffer], { type: 'application/pdf' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    }
  </script>
</body>
</html>
